name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project BuildingCharge.xcodeproj \
            -scheme BuildingCharge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BuildingCharge.app Payload/
          zip -r BuildingCharge.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BuildingCharge-ipa
          path: BuildingCharge.ipa
